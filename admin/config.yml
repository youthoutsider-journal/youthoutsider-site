# Admin panel (Decap CMS) for youthoutsider.org/admin
backend:
  name: github
  repo: youthoutsider-journal/youthoutsider-site
  branch: main

# Draft -> In review -> Ready columns. Nothing goes live until it's published.
publish_mode: editorial_workflow

site_url: https://youthoutsider.org
display_url: https://youthoutsider.org
logo_url: /images/site/logo.png

media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: content/articles
    format: json
    extension: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{desk}}, {{date}})"
    sortable_fields: [date, title, desk]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Desk, name: desk, widget: select, options: ["U.S. Politics", "International Relations", "Op-Ed"] }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false }
      - { label: Author, name: author, widget: relation, collection: authors, value_field: name, search_fields: [name], display_fields: [name], required: false, hint: "Leave blank to credit the Youth Outsider Editorial Team." }
      - { label: Read time (minutes), name: read_time, widget: number, value_type: int, default: 3, min: 1 }
      - { label: Dek (one-line summary under the headline), name: dek, widget: text }
      - { label: Cover image, name: cover, widget: image }
      - { label: Cover image description (for screen readers), name: cover_alt, widget: string, required: false }
      - { label: Cover caption and credit, name: cover_caption, widget: string, required: false, hint: "e.g. Collage by Youth Outsider. Photo: Name / Wikimedia Commons (CC BY 2.0)." }
      - label: Article text
        name: body
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: []
        hint: "Paste the edited article here. Leave a blank line between paragraphs."
      - label: Side graphics (text wraps around them)
        name: figures
        widget: list
        required: false
        summary: "{{fields.alt}}: paragraph {{fields.paragraph}}, {{fields.side}}"
        fields:
          - { label: Image (transparent PNG cutout), name: image, widget: image }
          - { label: Side, name: side, widget: select, options: [right, left], default: right }
          - { label: Next to paragraph number, name: paragraph, widget: number, value_type: int, min: 1, default: 1 }
          - { label: Description (for screen readers), name: alt, widget: string }
          - { label: Size, name: width, widget: select, options: [{ label: Normal, value: normal }, { label: Wide (maps), value: wide }], default: normal, required: false }
      - { label: Photo credits (shown at the end), name: credits, widget: string, required: false }
      - { label: Lead story on the home page, name: featured, widget: boolean, default: false, required: false, hint: "Turn on to put this article at the top of the home page. Turn it off on the old lead story." }
      - { label: URL slug, name: slug, widget: string, required: false, hint: "Optional. Leave blank to make it from the title, e.g. the-war-nobody-voted-on" }

  - name: authors
    label: Authors
    label_singular: Author
    folder: content/authors
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string, required: false, hint: "e.g. Staff writer, Editor, U.S. Politics Desk Lead" }
      - { label: Author bio, name: bio, widget: text, hint: "Two or three sentences, in the third person. Shown at the end of their articles." }
